<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinkjulieland - รับทำเว็บไซต์ & Goodnotes</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600&display=swap" rel="stylesheet">
   
    <script src="https://cdn.tailwindcss.com"></script>
   
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Mitr', 'sans-serif'],
                    },
                    colors: {
                        cream: '#FFFBF0',    /* เหลืองครีมละมุนมากๆ (Pale Cream) */
                        pinky: {
                            light: '#FFE4E1', /* ชมพูอ่อน */
                            DEFAULT: '#FFB6C1', /* ชมพูหลัก */
                            dark: '#FF91A4'   /* ชมพูเข้ม */
                        },
                        brown: {
                            light: '#A0522D', /* น้ำตาลอ่อน */
                            DEFAULT: '#6B4423', /* น้ำตาลตัวอักษรหลัก */
                            dark: '#4A2F1D'   /* น้ำตาลเข้ม */
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(255, 182, 193, 0.3)',
                        'card': '0 10px 25px -5px rgba(255, 182, 193, 0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFBF0;
            color: #6B4423;
        }
       
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFFBF0;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB6C1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF91A4;
        }
        /* Modal Transitions */
        .modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s ease;
            transform: translateY(20px) scale(0.95);
        }
        .modal.active .modal-content {
            transform: translateY(0) scale(1);
        }
        /* Float Animations for decorations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(15px) rotate(-8deg); }
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
       
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-float-delayed { animation: float 4s ease-in-out 2s infinite; }
        .animate-float-reverse { animation: float-reverse 5s ease-in-out 1s infinite; }
        .animate-float-slow { animation: float-slow 6s ease-in-out infinite; }
    </style>
</head>
